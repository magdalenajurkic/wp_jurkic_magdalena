<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kartice s informacijama o gradovima i CSS zastava Švicarske">
    <title>Informacije o gradu</title>

    <style>
        body {
            background-color: #f5f5f5;
        }

        /* Kartice */
        .card {
            background-color: #87CEEB;
            padding: 20px;
            margin: 20px;
            border: 2px solid #333333;
            border-radius: 6px;
            position: relative;
            width: 300px;
            display: inline-block;
            vertical-align: top;
        }

        .card h2 {
            font-family: Arial, sans-serif;
            font-size: 24px;
            display: inline-block;
            width: 100%;
            text-align: center;
            margin-top: 0;
        }

        .card p {
            font-family: Verdana, sans-serif;
            font-size: 16px;
            color: #333333;
        }

        /* Apsolutno pozicionirane dodatne informacije */
        .extra-info {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 14px;
        }

        .extra-info a {
            text-decoration: none;
            color: #00008B;
        }

        /* Zastava Švicarske */
        .flag-container {
            width: 250px;
            height: 250px;
            background-color: #D52B1E;
            position: relative;
            margin: 40px auto;
        }

        .cross-vertical {
            position: absolute;
            width: 40px;
            height: 150px;
            background-color: #FFFFFF;
            top: 50px;
            left: 105px;
        }

        .cross-horizontal {
            position: absolute;
            width: 150px;
            height: 40px;
            background-color: #FFFFFF;
            top: 105px;
            left: 50px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Informacije o gradu</h2>
        <p><strong>Naziv:</strong> Zagreb</p>
        <p><strong>Država:</strong> Hrvatska</p>
        <p><strong>Populacija:</strong> oko 790 000</p>
        <p class="extra-info">
            <a href="https://hr.wikipedia.org/wiki/Zagreb" target="_blank">
                Dodatne informacije
            </a>
        </p>
    </div>

    <div class="card">
        <h2>Informacije o gradu</h2>
        <p><strong>Naziv:</strong> Beč</p>
        <p><strong>Država:</strong> Austrija</p>
        <p><strong>Populacija:</strong> oko 1 900 000</p>
        <p class="extra-info">
            <a href="https://hr.wikipedia.org/wiki/Be%C4%8D" target="_blank">
                Dodatne informacije
            </a>
        </p>
    </div>

    <div class="card">
        <h2>Informacije o gradu</h2>
        <p><strong>Naziv:</strong> Zürich</p>
        <p><strong>Država:</strong> Švicarska</p>
        <p><strong>Populacija:</strong> oko 430 000</p>
        <p class="extra-info">
            <a href="https://hr.wikipedia.org/wiki/Z%C3%BCrich" target="_blank">
                Dodatne informacije
            </a>
        </p>
    </div>

    <!-- Zastava Švicarske -->
    <div class="flag-container">
        <div class="cross-vertical"></div>
        <div class="cross-horizontal"></div>
    </div>

</body>
</html>
