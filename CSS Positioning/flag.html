<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zastava</title>
    <style>
    .red {
        width: 500px;
        height: 300px;
        background-color: red;
        position: relative;
    }
    .blue {
        width: 500px;
        height: 150px;
        position: absolute;
        background-color: darkblue;
        bottom: 75px;
    }
    .krug {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        position: absolute;
        background-color: antiquewhite;
        bottom: 90px;
        left: 185px;

    }
    .plava {
        width: 500px;
        height: 300px;
        background-color: blue;
        position: relative;
    }
    .zuta_1 {
        width: 60px;
        height: 300px;
        background-color: yellow;
        position: absolute;
        left: 120px;
    }
    .zuta_2 {
        width: 500px;
        height: 60px;
        background-color: yellow;
        bottom: 120px;
        position: absolute;
    }





    </style>
</head>
<body>
    <h1>Zastava Laosa </h1>
    <div class="red">
        <div class="blue"></div>
        <div class="krug"></div>
    </div>


    <h1>Zastava Švedske</h1>
    <div class="plava">
        <div class="zuta_1"></div>
        <div class="zuta_2"></div>
    </div>


    
</body>
</html>
